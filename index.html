*{box-sizing:border-box}
body{margin:0;background:#06142b;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #15345a}
.logo{font-size:25px;font-weight:bold;letter-spacing:2px}
.logo span{color:#00d9ff}
.hero{text-align:center;padding:90px 20px;background:radial-gradient(circle at top,#103c76,#06142b 65%)}
h1{font-size:48px;margin:15px 0}
h1 span{color:#00d9ff}
p{color:#b8cce5;line-height:1.7}
.btn{display:inline-block;background:#00d9ff;color:#06142b;padding:15px 25px;border-radius:9px;text-decoration:none;font-weight:bold;margin-top:15px}
section{padding:55px 7%;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}

.card h3{color:#00d9ff}
